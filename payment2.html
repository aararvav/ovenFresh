<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css">
</head>
<body>
    <header class="header">
        <nav>
          <div class="nav__header">
            <div class="nav__logo">
              <a href="index.html">
                <img
                  src="logo.jpg"
                  alt="logo"
                  class="nav__logo-dark"
                />
              </a>
            </div>
            <div class="nav__menu__btn" id="menu-btn">
              <i class="ri-menu-line">ovenFresh</i>
            </div>
          </div>
          <ul class="nav__links" id="nav-links">
            <li><a href="index.html">HOME</a></li>
            <li><a href="index.html">SPECIAL</a></li>
            <li><a href="index.html">ABOUT US</a></li>
            <li><a href="menu.html">MENU </a></li>
            <li><a href="cart.html">CART</a></li>
            <li><a href="login.html">LOGIN</a></li>
          </ul>
        </nav>
    </header>

  <div class="payment-container">
    <div class="payment-options">
      <h3>Select a payment method</h3>
      <ul>
        <li onclick="showForm('card')">Credit/Debit Card</li>
        <li onclick="showForm('netbanking')">Netbanking</li>
        <li onclick="showForm('wallet')">Wallet</li>
        <li onclick="showForm('upi')">UPI</li>
        <li onclick="showForm('cod')">Cash on Delivery</li>
      </ul>
    </div>

    <div class="payment-form">
      <h3>Amount payable: ₹<span id="amount-payable">0</span></h3>
      <div id="form-content">
        <!-- Dynamic form fields will be displayed here -->
      </div>
      <button class="pay-btn" onclick="processPayment()">PAY NOW</button>
    </div>
  </div>

  <script src="main.js"></script>
  <script src="payment.js"></script>
  <script src="cart.js"></script>
</body>
</html>
