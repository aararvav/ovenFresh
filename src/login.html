    <div class="bodyy">
      <div class="wrapper" id="form-wrapper">
        <!-- Login Form -->
        <form id="login-form">
          <h1>login</h1>
          <div class="inputbox">
            <input type="text" id="username" placeholder="username" required>
          </div>
          <div class="inputbox">
            <input type="password" id="password" placeholder="password" required>
            <button type="button" id="toggle-password" style="position: absolute; right: 20px; top: 40%; background: none; border: none; cursor: pointer;">👁️</button>
          </div>
          <div class="rememberme">
            <label><input type="checkbox">remember me</label>
            <a href="#">forgot password?</a>
          </div>
          <button type="submit" id="loginbutton" class="btnn">LOGIN</button>
          <div class="registerlink">
            <p>don't have an account? <a href="#" id="register-link">register now</a></p>
          </div>
        </form>
    
        <!-- Register Form (Initially Hidden) -->
        <form id="register-form" style="display: none;">
          <h1>create account</h1>
          <div class="inputbox">
            <input type="text" id="first-name" placeholder="first name" required>
          </div>
          <div class="inputbox">
            <input type="text" id="last-name" placeholder="last name" required>
          </div>
          <div class="inputbox">
            <input type="email" id="email" placeholder="email id" required>
          </div>
          <div class="inputbox">
            <input type="password" id="register-password" placeholder="password" required>
            <button type="button" id="toggle-register-password" style="position: absolute; right: 20px; top: 40%; background: none; border: none; cursor: pointer;">👁️</button>
          </div>
          <button type="submit" class="btnn">CREATE ACCOUNT</button>
          <div class="registerlink">
            <p>already have an account? <a href="#" id="login-link">login</a></p>
          </div>
        </form>
      </div>
    </div>
